<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中興男宿掃區抽籤</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tape:#f5e87a;--tape2:#b8d4f0;--tape3:#f0b8c8;
  --ink:#1a1208;--ink-dim:#6b5c3e;
  --red:#e8341c;--blue:#1a5fb4;--green:#2d7d46;
  --orange:#e67e22;--yellow:#f1c40f;
  --door-wood:#8B5E3C;--door-dark:#5C3A1E;--door-light:#C4874F;
  --door-open:#3a2410;--door-frame:#4a2e10;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans TC',sans-serif;
  background-color:#b8ab90;
  background-image:
    repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(168,152,112,.15) 59px,rgba(168,152,112,.15) 60px),
    repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(168,152,112,.15) 59px,rgba(168,152,112,.15) 60px);
  min-height:100vh;display:flex;justify-content:center;
  padding:28px 14px 60px;overflow-x:hidden;
}
.app-wrap{width:100%;max-width:720px;position:relative;z-index:1}
 
/* ── HEADER ── */
.header{position:relative;margin-bottom:24px;padding:18px 20px 14px}
.banner-tape{position:absolute;width:60px;height:22px;border-radius:2px;opacity:.82}
.banner-tape.t1{top:-8px;left:18px;background:var(--tape);transform:rotate(-3deg)}
.banner-tape.t2{top:-8px;right:30px;background:var(--tape2);transform:rotate(2deg)}
.banner-paper{
  background:#f5f0e6;border-radius:3px 5px 4px 3px;
  padding:16px 20px 14px;
  box-shadow:3px 4px 0 rgba(30,20,5,.18),6px 7px 0 rgba(30,20,5,.08);
  position:relative;
  clip-path:polygon(0% 4%,2% 0%,4% 3%,6% 1%,9% 4%,12% 1%,15% 3%,18% 0%,21% 3%,25% 1%,28% 4%,32% 0%,36% 3%,40% 1%,44% 3%,48% 0%,52% 2%,56% 0%,60% 3%,64% 1%,68% 3%,72% 0%,76% 2%,80% 0%,84% 3%,88% 1%,92% 4%,96% 1%,100% 3%,100% 100%,0% 100%);
}
.title-graffiti{font-family:'Permanent Marker',cursive;font-size:30px;color:var(--red);line-height:1;letter-spacing:1px;text-shadow:2px 2px 0 rgba(232,52,28,.2);transform:rotate(-1deg);display:inline-block;margin-bottom:4px}
.subtitle-hand{font-family:'Caveat',cursive;font-size:16px;color:var(--ink-dim);display:inline-block;margin-left:4px}
.progress-sticker{
  position:absolute;top:10px;right:20px;width:72px;height:72px;
  background:var(--yellow);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:2px 3px 0 rgba(30,20,5,.22);transform:rotate(8deg);border:3px solid var(--ink);
}
.progress-num{font-family:'Permanent Marker',cursive;font-size:20px;color:var(--ink);line-height:1}
.progress-label{font-family:'Caveat',cursive;font-size:11px;color:var(--ink-dim);margin-top:1px}
 
/* ── ZONE POOL ── */
.pool-panel{position:relative;margin-bottom:20px}
.pool-pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:16px;height:16px;background:#c0392b;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:2}
.pool-pin::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:rgba(0,0,0,.3);border-radius:50%}
.pool-paper{background:#f9f5ea;border-radius:3px;padding:16px 18px 18px;box-shadow:2px 3px 0 rgba(30,20,5,.15);border:1px solid rgba(30,20,5,.08)}
.pool-label-hand{font-family:'Caveat',cursive;font-size:14px;color:var(--ink-dim);margin-bottom:12px;border-bottom:1.5px dashed rgba(30,20,5,.15);padding-bottom:6px}
.pool-tags-wrap{position:relative}
.pool-tags-track{display:flex;flex-wrap:wrap;gap:10px 8px}
 
/* wobble keyframes — 9 variants so tags don't all move in sync */
@keyframes wob1{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}25%{transform:rotate(calc(var(--r,0deg) + 2.5deg)) translateY(-2px)}75%{transform:rotate(calc(var(--r,0deg) - 1.5deg)) translateY(1px)}}
@keyframes wob2{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}30%{transform:rotate(calc(var(--r,0deg) - 3deg)) translateY(-3px)}70%{transform:rotate(calc(var(--r,0deg) + 2deg)) translateY(1.5px)}}
@keyframes wob3{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}40%{transform:rotate(calc(var(--r,0deg) + 1.5deg)) translateY(-1.5px)}80%{transform:rotate(calc(var(--r,0deg) - 2.5deg)) translateY(2px)}}
@keyframes wob4{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}20%{transform:rotate(calc(var(--r,0deg) - 2deg)) translateY(-2.5px)}60%{transform:rotate(calc(var(--r,0deg) + 3deg)) translateY(1px)}}
@keyframes wob5{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}35%{transform:rotate(calc(var(--r,0deg) + 2deg)) translateY(-1px)}65%{transform:rotate(calc(var(--r,0deg) - 1deg)) translateY(2.5px)}}
@keyframes wob6{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}45%{transform:rotate(calc(var(--r,0deg) - 2.5deg)) translateY(-2px)}85%{transform:rotate(calc(var(--r,0deg) + 1.5deg)) translateY(.5px)}}
@keyframes wob7{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}15%{transform:rotate(calc(var(--r,0deg) + 3deg)) translateY(-3px)}55%{transform:rotate(calc(var(--r,0deg) - 2deg)) translateY(2px)}}
@keyframes wob8{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(calc(var(--r,0deg) - 1.5deg)) translateY(-2px)}90%{transform:rotate(calc(var(--r,0deg) + 2.5deg)) translateY(1.5px)}}
@keyframes wob9{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}55%{transform:rotate(calc(var(--r,0deg) + 1deg)) translateY(-1px)}80%{transform:rotate(calc(var(--r,0deg) - 3deg)) translateY(2px)}}
 
.zone-tag{
  display:inline-flex;align-items:center;
  padding:6px 14px;border-radius:3px;
  font-family:'Caveat',cursive;font-size:14px;font-weight:700;color:#fff;
  white-space:nowrap;flex-shrink:0;
  box-shadow:2px 2px 0 rgba(0,0,0,.22);
  transform:rotate(var(--r,0deg));
  /* wobble via JS-set animation-name */
  animation:var(--wob,wob1) var(--wob-dur,2.4s) ease-in-out infinite;
  animation-delay:var(--wob-delay,0s);
  position:relative;
  transition:opacity .4s,filter .2s,box-shadow .2s;
}
/* sticker shine */
.zone-tag::after{
  content:'';position:absolute;inset:0;border-radius:3px;
  background:linear-gradient(135deg,rgba(255,255,255,.25) 0%,transparent 60%);
  pointer-events:none;
}
.zone-tag.used{
  opacity:0;transform:scale(.3) rotate(var(--r,0deg));
  pointer-events:none;
  animation:none;
  transition:opacity .5s,transform .5s;
}
.zone-tag.hl{
  animation:none !important;
  filter:brightness(1.3) saturate(1.2);
  transform:rotate(var(--r,0deg)) scale(1.15) translateY(-4px) !important;
  box-shadow:3px 3px 0 rgba(0,0,0,.3),0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.28);
  z-index:4;
}
.zone-tag.winner{
  animation:stickerWin .35s ease infinite alternate !important;
  filter:brightness(1.4) saturate(1.3);
  box-shadow:3px 3px 0 rgba(0,0,0,.3),0 0 0 4px #fff,0 0 0 7px rgba(0,0,0,.45);
  z-index:5;
}
@keyframes stickerWin{
  from{transform:rotate(var(--r,0deg)) scale(1.2) translateY(-5px)}
  to{transform:rotate(calc(var(--r,0deg) + 4deg)) scale(1.28) translateY(-8px)}
}
.pool-empty{font-family:'Caveat',cursive;font-size:15px;color:var(--green);font-weight:700}
 
/* ── DOOR GRID ── */
.door-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:14px;
  margin-bottom:22px;
}
 
/* each door slot — 3D perspective container */
.door-slot{
  perspective:400px;
  height:130px;
  position:relative;
  cursor:pointer;
}
 
/* the frame (wall around the door) */
.door-frame{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#9a7a5a,#7a5a3a);
  border-radius:5px 5px 3px 3px;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),2px 3px 0 rgba(30,20,5,.3);
  /* door number plate below */
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:8px;
}
.door-frame::before{
  /* brick texture lines */
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(0deg,transparent,transparent 14px,rgba(0,0,0,.08) 14px,rgba(0,0,0,.08) 15px),
             repeating-linear-gradient(90deg,transparent,transparent 22px,rgba(0,0,0,.06) 22px,rgba(0,0,0,.06) 23px);
}
/* dark interior behind open door */
.door-interior{
  position:absolute;inset:4px 4px 22px 4px;
  background:radial-gradient(ellipse at 30% 40%,#4a3018 0%,#1a0e06 70%);
  border-radius:3px 3px 0 0;
  overflow:hidden;
}
/* result shown inside open door */
.door-result{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px;
  opacity:0;transition:opacity .4s .35s;
}
.door-result.visible{opacity:1}
.door-result-zone{
  font-family:'Caveat',cursive;font-size:13px;font-weight:700;
  color:#f5e8c0;
  text-align:center;line-height:1.3;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  word-break:break-all;
  padding:0 4px;
}
/* tiny lightbulb at top of interior */
.door-bulb{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;background:#ffe97a;border-radius:50%;
  box-shadow:0 0 6px 3px rgba(255,233,122,.5);
  opacity:0;transition:opacity .3s .5s;
}
.door-result.visible ~ .door-bulb,
.door-interior.lit .door-bulb{opacity:1}
 
/* the door panel itself — hinged on left */
.door-panel-wrap{
  position:absolute;
  top:4px;left:4px;right:4px;bottom:22px;
  transform-style:preserve-3d;
  transform-origin:left center;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}
.door-slot.open .door-panel-wrap{
  transform:rotateY(-75deg);
}
.door-slot.drawing .door-panel-wrap{
  animation:doorRattle .12s ease infinite alternate;
}
@keyframes doorRattle{
  from{transform:rotateY(-4deg) translateX(1px)}
  to{transform:rotateY(4deg) translateX(-1px)}
}
 
/* front face of door */
.door-front{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:3px 3px 0 0;
  overflow:hidden;
}
.door-wood{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,.08) 0%,rgba(255,255,255,.0) 8%,
      rgba(0,0,0,.06) 12%,rgba(255,255,255,.04) 18%,
      rgba(0,0,0,.07) 25%,rgba(255,255,255,.05) 32%,
      rgba(0,0,0,.05) 40%,rgba(255,255,255,.03) 48%,
      rgba(0,0,0,.06) 55%,rgba(255,255,255,.04) 62%,
      rgba(0,0,0,.05) 70%,rgba(255,255,255,.03) 80%,
      rgba(0,0,0,.06) 90%,rgba(255,255,255,.02) 100%
    ),
    linear-gradient(160deg,#C4874F 0%,#a0622e 40%,#8B5E3C 60%,#7a4e2c 100%);
}
/* door panels (decorative recessed rectangles) */
.door-panel-deco{
  position:absolute;
  border:2px solid rgba(0,0,0,.25);
  border-radius:2px;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.15);
}
.door-panel-deco.top{top:10%;left:12%;right:12%;height:35%}
.door-panel-deco.bot{top:50%;left:12%;right:12%;bottom:5%}
 
/* door number sign */
.door-num-plate{
  position:absolute;
  bottom:0;left:0;right:0;
  height:22px;
  background:linear-gradient(135deg,#5a3a1a,#3a2010);
  display:flex;align-items:center;justify-content:center;
  border-radius:0 0 3px 3px;
}
.door-num{
  font-family:'Permanent Marker',cursive;
  font-size:14px;color:#f5d990;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
  letter-spacing:.5px;
}
 
/* knob */
.door-knob{
  position:absolute;right:10%;top:50%;transform:translateY(-50%);
  width:9px;height:9px;
  background:radial-gradient(circle at 35% 35%,#e8c86a,#9a7020);
  border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.5);
}
/* status stripe at top */
.door-status-bar{
  position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--orange);border-radius:3px 3px 0 0;
  transition:background .3s;
}
.door-slot.drawing .door-status-bar{background:var(--yellow);animation:statusBlink .4s step-end infinite}
.door-slot.open .door-status-bar{background:var(--green)}
@keyframes statusBlink{50%{opacity:0}}
 
/* hover wobble */
.door-slot:not(.open):not(.drawing):hover .door-panel-wrap{
  animation:doorHover .4s ease forwards;
}
@keyframes doorHover{
  0%{transform:rotateY(0)}
  40%{transform:rotateY(-14deg)}
  70%{transform:rotateY(-8deg)}
  100%{transform:rotateY(-12deg)}
}
.door-slot:not(.open):not(.drawing):hover .door-status-bar{background:var(--blue)}
 
/* burst canvas */
.burst-canvas{position:absolute;inset:0;pointer-events:none;z-index:10}
 
/* ── ACTIONS ── */
.actions-tape{position:relative;padding:0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions-tape::before{content:'';position:absolute;top:50%;left:-8px;right:-8px;height:28px;transform:translateY(-50%) rotate(-.3deg);background:var(--tape);opacity:.55;z-index:0;border-radius:1px}
.btn{position:relative;z-index:1;font-family:'Caveat',cursive;font-size:15px;font-weight:700;color:var(--ink);background:#f5f0e3;border:2px solid var(--ink);border-radius:3px;padding:7px 18px;cursor:pointer;box-shadow:2px 2px 0 rgba(30,20,5,.25);transition:transform .1s,box-shadow .1s;letter-spacing:.5px}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(30,20,5,.25)}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(30,20,5,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn-export{background:#2d7d46;color:#fff;border-color:#1a5230;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn-export:hover:not([disabled]){background:#3a9a58!important;color:#fff!important}
.btn-right{margin-left:auto}
.btn-settings{background:#1a5fb4;color:#fff;border-color:#0d3d7a}
.btn-settings:hover{background:#2471d0!important;color:#fff!important}
 
/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#f5f0e3;border:2px solid var(--ink);color:var(--green);padding:10px 22px;border-radius:3px;font-family:'Caveat',cursive;font-size:16px;font-weight:700;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:3px 3px 0 rgba(30,20,5,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
 
/* ── FULLSCREEN REVEAL ── */
#revealOverlay{display:none;position:fixed;inset:0;z-index:9800;background:#1a0e06;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#revealOverlay.active{display:flex}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.reveal-inner{position:relative;z-index:2;text-align:center;padding:40px 28px}
.reveal-dorm-label{font-family:'Caveat',cursive;font-size:14px;color:rgba(255,230,180,.5);letter-spacing:3px;margin-bottom:4px}
.reveal-dorm{font-family:'Permanent Marker',cursive;font-size:clamp(80px,18vw,160px);color:#f5d990;line-height:.9;text-shadow:4px 4px 0 rgba(180,120,40,.3),0 0 60px rgba(255,210,80,.3);margin-bottom:12px;animation:sprayIn .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes sprayIn{from{opacity:0;transform:scale(3);filter:blur(20px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.reveal-arrow{font-family:'Permanent Marker',cursive;font-size:32px;color:rgba(255,230,180,.4);margin-bottom:8px;animation:bounce .6s ease infinite alternate}
@keyframes bounce{to{transform:translateY(6px)}}
.reveal-zone{font-family:'Permanent Marker',cursive;font-size:clamp(26px,7vw,52px);color:#fff;text-shadow:3px 3px 0 rgba(255,255,255,.15),0 0 40px rgba(255,255,255,.3);letter-spacing:1px;margin-bottom:36px;animation:zoneIn .4s .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes zoneIn{from{opacity:0;transform:translateY(30px) rotate(-3deg)}to{opacity:1;transform:translateY(0) rotate(-1deg)}}
.reveal-close{font-family:'Caveat',cursive;font-size:16px;font-weight:700;color:#1a1208;background:#f5f0e3;border:3px solid #1a1208;border-radius:3px;padding:11px 36px;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
.reveal-close:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.scratch{position:absolute;pointer-events:none;opacity:.07;font-family:'Permanent Marker',cursive;font-size:120px;color:#fff;user-select:none}
 
/* ── MODALS ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,18,8,.7);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:10000}
.modal-bg.open{display:flex}
.modal{background:#f5f0e3;border:2px solid var(--ink);border-radius:4px;padding:26px 22px 22px;width:90%;max-width:340px;position:relative;box-shadow:5px 5px 0 rgba(30,20,5,.3)}
.modal::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:60px;height:18px;background:var(--tape2);opacity:.9;border-radius:1px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.modal h3{font-family:'Permanent Marker',cursive;font-size:20px;color:var(--ink);margin-bottom:14px;transform:rotate(-.5deg);display:inline-block}
.modal label{font-family:'Caveat',cursive;font-size:14px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:700}
.modal textarea,.modal input[type=password]{width:100%;padding:9px 11px;font-size:13px;border-radius:3px;border:2px solid rgba(30,20,5,.25);background:#faf7f0;color:var(--ink);outline:none;font-family:'Noto Sans TC',sans-serif;transition:border-color .2s}
.modal textarea{height:90px;resize:vertical;margin-bottom:14px}
.modal input[type=password]{margin-bottom:7px}
.modal textarea:focus,.modal input[type=password]:focus{border-color:var(--blue)}
.btn-save{width:100%;padding:11px;background:var(--green);color:#fff;border:2px solid #1a5230;border-radius:3px;cursor:pointer;font-family:'Caveat',cursive;font-size:16px;font-weight:700;box-shadow:3px 3px 0 rgba(30,20,5,.2);transition:transform .1s,box-shadow .1s;letter-spacing:.5px}
.btn-save:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(30,20,5,.2)}
.pwd-err{font-family:'Caveat',cursive;font-size:13px;color:var(--red);min-height:18px;margin-bottom:7px;font-weight:700}
</style>
</head>
<body>
<div class="app-wrap">
  <!-- header -->
  <div class="header">
    <span class="banner-tape t1"></span>
    <span class="banner-tape t2"></span>
    <div class="banner-paper">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div class="title-graffiti">掃區分配</div><br>
          <span class="subtitle-hand">敲敲門，看看命運 🚪</span>
        </div>
        <div class="progress-sticker">
          <div class="progress-num" id="progress">0/0</div>
          <div class="progress-label">已分配</div>
        </div>
      </div>
    </div>
  </div>
 
  <!-- zone pool -->
  <div class="pool-panel">
    <div class="pool-pin"></div>
    <div class="pool-paper">
      <div class="pool-label-hand">🏷️ 剩餘掃區</div>
      <div class="pool-tags-wrap">
        <div class="pool-tags-track" id="zonesPool"></div>
      </div>
    </div>
  </div>
 
  <!-- door grid -->
  <div class="door-grid" id="grid"></div>
 
  <!-- actions -->
  <div class="actions-tape">
    <button class="btn" onclick="confirmReset()">重置</button>
    <a id="exportBtn" class="btn btn-export" style="opacity:.4;pointer-events:none">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 10v2h10v-2M7 2v7M4 6l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      匯出 Excel
    </a>
    <button class="btn btn-settings btn-right" onclick="openModal()">設定名單</button>
  </div>
</div>
 
<!-- fullscreen reveal -->
<div id="revealOverlay">
  <canvas id="bgCanvas"></canvas>
  <div class="scratch" style="top:5%;left:5%;transform:rotate(-15deg)">//</div>

<!-- settings -->

  </div>
</div>
 
<script>
/* ── audio ── */
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,t,d,v,delay=0){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=t;o.frequency.setValueAtTime(f,AC.currentTime+delay);g.gain.setValueAtTime(0,AC.currentTime+delay);g.gain.linearRampToValueAtTime(v,AC.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+delay+d);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+d+.05);}
function playKnock(){beep(120,'sine',.07,.18);beep(120,'sine',.07,.15,.12);}
function playCreak(){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(180,AC.currentTime);o.frequency.exponentialRampToValueAtTime(60,AC.currentTime+.5);g.gain.setValueAtTime(.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.5);o.start();o.stop(AC.currentTime+.5);}
function playWin(){beep(392,'sine',.12,.12);beep(494,'sine',.12,.12,.13);beep(587,'sine',.15,.12,.27);beep(784,'sine',.45,.18,.44);}
function playTick(){beep(280+Math.random()*120,'triangle',.05,.06);}
function resumeAC(){if(AC.state==='suspended')AC.resume();}
function vib(p){if(navigator.vibrate)navigator.vibrate(p);}
 
/* ── tag colors ── */
const TAG_COLORS=['#c0392b','#1a5fb4','#2d7d46','#7d3c98','#e67e22','#1a6b6b','#8b3a3a','#2c5f2e','#b7410e','#0d5fa8'];
const ROTS=[-2,-1,0,1,2];
let tagCI=0;
function nextTag(){const c=TAG_COLORS[tagCI%TAG_COLORS.length];const r=ROTS[Math.floor(Math.random()*ROTS.length)];tagCI++;return{color:c,rot:r};}
 
/* ── state ── */
let remainingPool=[],drawn=0,total=0,busy=false,results=[],revealCallback=null;
function ld(k,d){try{return localStorage.getItem(k)||d}catch{return d}}
function sv(k,v){try{localStorage.setItem(k,v)}catch{}}
 
/* ── wobble setup ── */
const WOB_NAMES=['wob1','wob2','wob3','wob4','wob5','wob6','wob7','wob8','wob9'];
function applyWobble(el,idx){
  el.style.setProperty('--wob',WOB_NAMES[idx%WOB_NAMES.length]);
  el.style.setProperty('--wob-dur',(2.0+Math.random()*1.8).toFixed(2)+'s');
  el.style.setProperty('--wob-delay',(Math.random()*2).toFixed(2)+'s');
}
 
/* ── init ── */
function initApp(){
  drawn=0;busy=false;results=[];revealCallback=null;tagCI=0;
  const btn=document.getElementById('exportBtn');
  btn.style.opacity='.4';btn.style.pointerEvents='none';btn.removeAttribute('href');btn.removeAttribute('download');
 
  const dorms=ld('d_dorms',"301\n302\n303\n304\n307\n308\n309\n310\n311\n312\n401\n402\n403\n404\n408").trim().split('\n').filter(x=>x.trim());
  const zones=ld('d_zones',"垃圾\n垃圾\n2樓 洗衣場+晒衣場\n3樓 洗衣場+晒衣場\n4樓 洗衣場+晒衣場\n2樓 廁所\n3樓 廁所\n4樓 廁所\n2樓 浴室\n3樓 浴室\n4樓 浴室\n2樓 琉理台+走廊+飲水機\n3樓 琉理台+走廊+飲水機\n4樓 琉理台+走廊+飲水機\n2.4樓冰箱").trim().split('\n').filter(x=>x.trim());
  total=dorms.length;
  let pool=[...zones];
  while(pool.length<dorms.length)pool.push('沒有東西啊!');
  pool=pool.slice(0,dorms.length);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  remainingPool=[...pool];
 
  // build zone pool with wobble
  const pe=document.getElementById('zonesPool');
  pe.innerHTML='';tagCI=0;
  pool.forEach((z,idx)=>{
    const s=nextTag();
    const t=document.createElement('span');
    t.className='zone-tag';t.textContent=z;t.dataset.zone=z;
    t.style.background=s.color;t.style.setProperty('--r',s.rot+'deg');
    applyWobble(t,idx);
    pe.appendChild(t);
  });
 
  // build door grid
  const g=document.getElementById('grid');g.innerHTML='';
  dorms.forEach(d=>{
    const slot=document.createElement('div');
    slot.className='door-slot';slot.id='slot-'+d;
    slot.onclick=()=>{resumeAC();reveal(d);};
    slot.innerHTML=`
      <div class="door-frame">
        <div class="door-interior" id="int-${d}">
          <div class="door-bulb" id="bulb-${d}"></div>
          <div class="door-result" id="res-${d}">
            <div class="door-result-zone" id="resz-${d}"></div>
          </div>
        </div>
        <div class="door-num-plate"><span class="door-num">${d}</span></div>
      </div>
      <div class="door-panel-wrap" id="panel-${d}">
        <div class="door-front">
          <div class="door-wood"></div>
          <div class="door-panel-deco top"></div>
          <div class="door-panel-deco bot"></div>
          <div class="door-knob"></div>
          <div class="door-status-bar"></div>
        </div>
      </div>
      <canvas class="burst-canvas" id="bc-${d}"></canvas>
    `;
    g.appendChild(slot);
  });
  updateProgress();
}
 
/* ── reveal ── */
function reveal(dorm){
  if(busy)return;
  const slot=document.getElementById('slot-'+dorm);
  if(!slot||slot.classList.contains('open')||slot.classList.contains('drawing'))return;
  busy=true;slot.classList.add('drawing');
  playKnock();vib([40,60,40]);
 
  const pickIdx=Math.floor(Math.random()*remainingPool.length);
  const zone=remainingPool[pickIdx];remainingPool.splice(pickIdx,1);
 
  // animate zone pool stickers
  const avail=Array.from(document.querySelectorAll('#zonesPool .zone-tag:not(.used):not(.clone)'));
  if(!avail.length){openDoor(dorm,zone);return;}
  const winnerTag=avail.find(t=>t.dataset.zone===zone&&!t.classList.contains('used'))||avail[0];
  const wi=avail.indexOf(winnerTag);
 
  const FAST=10+Math.floor(Math.random()*6);
  let steps=[];
  for(let i=0;i<FAST;i++){let idx;do{idx=Math.floor(Math.random()*avail.length);}while(avail.length>1&&steps.length>0&&avail[idx]===steps[steps.length-1]);steps.push(avail[idx]);}
  const lastIdx=avail.indexOf(steps[steps.length-1]);
  const dist=((wi-lastIdx+avail.length)%avail.length)||avail.length;
  const extraLap=Math.floor(Math.random()*2)*avail.length;
  for(let i=1;i<=dist+extraLap;i++)steps.push(avail[(lastIdx+i)%avail.length]);
  const delays=steps.map((_,i)=>{if(i<FAST)return 50;const r=(i-FAST)/(steps.length-FAST);return Math.round(50+r*r*280);});
 
  let cur=-1;
  function step(i){
    if(cur>=0&&steps[cur])steps[cur].classList.remove('hl','winner');
    if(i>=steps.length){
      winnerTag.classList.add('winner');
      vib([15,30,15,30,60]);
      setTimeout(()=>{
        winnerTag.classList.remove('winner');
        // mark both original and clone as used
        document.querySelectorAll(`#zonesPool .zone-tag[data-zone="${CSS.escape(zone)}"]`).forEach((t,idx)=>{if(idx===0)t.classList.add('used');});
 
        openDoor(dorm,zone);
      },500);
      return;
    }
    cur=i;steps[i].classList.add('hl');
    playTick();
    setTimeout(()=>step(i+1),delays[i]);
  }
  step(0);
}
 
function openDoor(dorm,zone){
  const slot=document.getElementById('slot-'+dorm);
  slot.classList.remove('drawing');
  // show result inside door before opening
  document.getElementById('resz-'+dorm).textContent=zone;
  playCreak();vib([0,30,20,60,10,30]);
  setTimeout(()=>{
    slot.classList.add('open');
    setTimeout(()=>{
      document.getElementById('res-'+dorm).classList.add('visible');
      document.getElementById('bulb-'+dorm).style.opacity='1';
    },300);
    // show fullscreen after door opens
    setTimeout(()=>showReveal(dorm,zone,()=>finish(dorm,zone)),800);
  },100);
}
 
/* ── fullscreen reveal ── */
let animId=null;
function showReveal(dorm,zone,cb){
  revealCallback=cb;
  document.getElementById('revDorm').textContent=dorm;
  document.getElementById('revZone').textContent=zone;
  const rd=document.getElementById('revDorm'),rz=document.getElementById('revZone');
  rd.style.animation='none';rz.style.animation='none';void rd.offsetWidth;void rz.offsetWidth;rd.style.animation='';rz.style.animation='';
  document.getElementById('revealOverlay').classList.add('active');
  playWin();vib([0,50,30,80,50,200]);startSpray();
}
function closeReveal(){
  document.getElementById('revealOverlay').classList.remove('active');
  stopSpray();if(revealCallback){revealCallback();revealCallback=null;}
}
 
function startSpray(){
  const c=document.getElementById('bgCanvas');c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const blobs=[{x:.15,y:.2,r:200,color:'#8B5E3C'},{x:.85,y:.7,r:220,color:'#5C3A1E'},{x:.5,y:.4,r:180,color:'#a06030'},{x:.3,y:.8,r:150,color:'#7a4e2c'},{x:.7,y:.1,r:130,color:'#c4874f'}];
  const pts=Array.from({length:80},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,r:Math.random()*3+1,color:TAG_COLORS[Math.floor(Math.random()*TAG_COLORS.length)],life:Math.random()*.7+.3,decay:.003+Math.random()*.004}));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    blobs.forEach(b=>{const grd=ctx.createRadialGradient(b.x*c.width,b.y*c.height,0,b.x*c.width,b.y*c.height,b.r);grd.addColorStop(0,b.color+'55');grd.addColorStop(1,b.color+'00');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(b.x*c.width,b.y*c.height,b.r,0,Math.PI*2);ctx.fill();});
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.life<=0){p.x=Math.random()*c.width;p.y=Math.random()*c.height;p.life=.8;}ctx.save();ctx.globalAlpha=p.life*.5;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});
    animId=requestAnimationFrame(draw);
  }
  if(animId)cancelAnimationFrame(animId);draw();
}
function stopSpray(){if(animId){cancelAnimationFrame(animId);animId=null;}}
 
/* ── finish ── */
function finish(dorm,zone){
  results.push({dorm,zone});drawn++;busy=false;updateProgress();
  burst(dorm);
  if(drawn===total){
    const pe=document.getElementById('zonesPool');
    const remaining=pe.querySelectorAll('.zone-tag:not(.used):not(.clone)');
    if(!remaining.length)pe.innerHTML='<span class="pool-empty">✓ 全部分配完畢！</span>';
    activateExport();showToast('全部抽完了！可以匯出 Excel 囉 🎉');
  }
}
 
/* ── burst ── */
function burst(dorm){
  const c=document.getElementById('bc-'+dorm);if(!c)return;
  const slot=document.getElementById('slot-'+dorm);c.width=slot.offsetWidth;c.height=slot.offsetHeight;
  const ctx=c.getContext('2d');
  const ps=Array.from({length:28},()=>({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-3,r:Math.random()*3+1.5,color:TAG_COLORS[Math.floor(Math.random()*TAG_COLORS.length)],life:1,rot:Math.random()*Math.PI*2}));
  function draw(){ctx.clearRect(0,0,c.width,c.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;p.rot+=.08;if(p.life<=0)return;alive=true;ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});if(alive)requestAnimationFrame(draw);}
  draw();
}
 
/* ── progress ── */
function updateProgress(){document.getElementById('progress').textContent=drawn+'/'+total;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
 
/* ── export ── */
function activateExport(){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  const dateStr=`${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;
  const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const filename=`掃區分配_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.xlsx`;
  const zoneCounts={};results.forEach(r=>zoneCounts[r.zone]=(zoneCounts[r.zone]||0)+1);
  function pF(z){const m=z.match(/^(\d+(\.\d+)?樓)/);return m?m[1]:'';}
  function pN(z){return z.replace(/^\d+(\.\d+)?樓\s*/,'');}
  const zO=['垃圾','洗衣場+晒衣場','廁所','浴室','琉理台+走廊+飲水機','2.4樓冰箱'];
  const fO={'2樓':1,'3樓':2,'4樓':3,'':9};
  const sorted=[...results].sort((a,b)=>{const za=pN(a.zone),zb=pN(b.zone);const zo=(zO.indexOf(za)||99)-(zO.indexOf(zb)||99);if(zo!==0)return zo;return(fO[pF(a.zone)]||9)-(fO[pF(b.zone)]||9);});
  const nF=['垃圾','2.4樓冰箱'];
  const s1=[['樓層','男宿掃地區域表',''],...sorted.map(r=>{const zn=pN(r.zone),fl=pF(r.zone);return[nF.includes(zn)?'':fl,zn,String(r.dorm)];})];
  const s2=[['掃區','分配間數'],...Object.entries(zoneCounts),['',''],['總寢室數',String(results.length)],['抽籤日期',dateStr],['抽籤時間',timeStr]];
  const bytes=buildXlsx([{name:'分配結果',rows:s1},{name:'統計摘要',rows:s2}]);
  const b64=bytesToBase64(bytes);
  const btn=document.getElementById('exportBtn');
  btn.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+b64;
  btn.download=filename;btn.style.opacity='1';btn.style.pointerEvents='auto';
}
 
/* ── pwd/modal ── */
function confirmReset(){resumeAC();document.getElementById('resetPwdInput').value='';document.getElementById('resetPwdErr').textContent='';document.getElementById('resetPwdBg').classList.add('open');setTimeout(()=>document.getElementById('resetPwdInput').focus(),100);}
function checkResetPwd(){if(document.getElementById('resetPwdInput').value==='20090129sean'){document.getElementById('resetPwdBg').classList.remove('open');initApp();showToast('已重置！');}else{const e=document.getElementById('resetPwdErr');e.textContent='❌ 密碼錯了啦！';document.getElementById('resetPwdInput').value='';document.getElementById('resetPwdInput').focus();vib([100,50,100]);setTimeout(()=>e.textContent='',2000);}}
function openModal(){resumeAC();document.getElementById('pwdInput').value='';document.getElementById('pwdErr').textContent='';document.getElementById('pwdBg').classList.add('open');setTimeout(()=>document.getElementById('pwdInput').focus(),100);}
function pwdBgClick(e){if(e.target===document.getElementById('pwdBg'))document.getElementById('pwdBg').classList.remove('open');}
function checkPwd(){if(document.getElementById('pwdInput').value==='20090129sean'){document.getElementById('pwdBg').classList.remove('open');document.getElementById('dormsInput').value=ld('d_dorms',"301\n302\n303\n304\n307\n308\n309\n310\n311\n312\n401\n402\n403\n404\n408");document.getElementById('zonesInput').value=ld('d_zones',"垃圾\n垃圾\n2樓 洗衣場+晒衣場\n3樓 洗衣場+晒衣場\n4樓 洗衣場+晒衣場\n2樓 廁所\n3樓 廁所\n4樓 廁所\n2樓 浴室\n3樓 浴室\n4樓 浴室\n2樓 琉理台+走廊+飲水機\n3樓 琉理台+走廊+飲水機\n4樓 琉理台+走廊+飲水機\n2.4樓冰箱");document.getElementById('modalBg').classList.add('open');}else{const e=document.getElementById('pwdErr');e.textContent='❌ 密碼錯了啦！';document.getElementById('pwdInput').value='';document.getElementById('pwdInput').focus();vib([100,50,100]);setTimeout(()=>e.textContent='',2000);}}
function bgClick(e){if(e.target===document.getElementById('modalBg'))document.getElementById('modalBg').classList.remove('open');}
function saveAndRefresh(){sv('d_dorms',document.getElementById('dormsInput').value);sv('d_zones',document.getElementById('zonesInput').value);document.getElementById('modalBg').classList.remove('open');initApp();}
 
/* ── xlsx/zip ── */
function bytesToBase64(b){const C=0x8000;let s='';for(let i=0;i<b.length;i+=C)s+=String.fromCharCode(...b.subarray(i,i+C));return btoa(s);}
function buildXlsx(sheets){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  const sst=[];const sstMap={};
  function si(s){const k=String(s);if(sstMap[k]===undefined){sstMap[k]=sst.length;sst.push(k);}return sstMap[k];}
  sheets.forEach(sh=>sh.rows.forEach(row=>row.forEach(c=>{if(c!=null)si(c);})));
  function col(n){let s='';n++;while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26);}return s;}
  const shXmls=sheets.map(sh=>{const mc=Math.max(...sh.rows.map(r=>r.length));let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>';for(let c=0;c<mc;c++)x+=`<col min="${c+1}" max="${c+1}" width="18" customWidth="1"/>`;x+='</cols><sheetData>';sh.rows.forEach((row,ri)=>{x+=`<row r="${ri+1}">`;row.forEach((cell,ci)=>{const a=col(ci)+(ri+1);if(cell==null){x+=`<c r="${a}"/>`;return;}x+=`<c r="${a}" t="s"><v>${si(cell)}</v></c>`;});x+='</row>';});x+='</sheetData></worksheet>';return x;});
  let sstXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sst.length}" uniqueCount="${sst.length}">`;sst.forEach(s=>{sstXml+=`<si><t xml:space="preserve">${esc(s)}</t></si>`;});sstXml+='</sst>';
  let wbXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';sheets.forEach((sh,i)=>{wbXml+=`<sheet name="${esc(sh.name)}" sheetId="${i+1}" r:id="rId${i+2}"/>`;});wbXml+='</sheets></workbook>';
  let wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>';sheets.forEach((_,i)=>{wbRels+=`<Relationship Id="rId${i+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`;});wbRels+='</Relationships>';
  let ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>';sheets.forEach((_,i)=>{ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;});ct+='</Types>';

function buildZip(files){
  const enc=new TextEncoder();
  function u16(n){return[n&0xff,(n>>8)&0xff];}function u32(n){return[n&0xff,(n>>8)&0xff,(n>>16)&0xff,(n>>24)&0xff];}

  const parts=[];const cds=[];let offset=0;
  Object.entries(files).forEach(([name,content])=>{const nb=enc.encode(name),db=enc.encode(content),crc=crc32(db),sz=db.length;const lh=new Uint8Array([0x50,0x4B,0x03,0x04,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)]);parts.push(lh);parts.push(nb);parts.push(db);cds.push({nb,crc,sz,offset});offset+=lh.length+nb.length+sz;});
  const cdStart=offset;
  cds.forEach(({nb,crc,sz,offset:lo})=>{const cd=new Uint8Array([0x50,0x4B,0x01,0x02,20,0,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(lo)]);parts.push(cd);parts.push(nb);offset+=cd.length+nb.length;});

}
