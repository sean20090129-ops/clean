<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍掃區分配抽籤</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810;
  --bg2:#0a0f1e;
  --panel:#0d1428;
  --border:#1a2540;
  --cyan:#00f5ff;
  --magenta:#ff2d78;
  --yellow:#ffe600;
  --green:#39ff7e;
  --purple:#bf5fff;
  --text:#e2eaff;
  --text-dim:#5a6a8a;
  --glow-cyan:0 0 8px #00f5ff88,0 0 20px #00f5ff44;
  --glow-magenta:0 0 8px #ff2d7888,0 0 20px #ff2d7844;
  --glow-green:0 0 8px #39ff7e88,0 0 24px #39ff7e44;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin;scrollbar-color:#1a2540 #050810}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;justify-content:center;
  padding:28px 16px 60px;
  overflow-x:hidden;
}
 
/* scanline overlay */
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,255,.018) 2px,rgba(0,245,255,.018) 4px);
  pointer-events:none;z-index:9990;
}
 
/* grid bg */
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}
 
.app-wrap{width:100%;max-width:720px;position:relative;z-index:1}
 
/* header */
.header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:24px;padding-bottom:20px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.header::after{
  content:'';position:absolute;bottom:-1px;left:0;width:120px;height:1px;
  background:var(--cyan);box-shadow:var(--glow-cyan);
}
.title-block .label{
  font-size:10px;letter-spacing:3px;color:var(--cyan);
  font-family:'Rajdhani',sans-serif;margin-bottom:4px;
  text-shadow:var(--glow-cyan);
}
.title-block h1{
  font-family:'Rajdhani',sans-serif;
  font-size:28px;font-weight:700;
  color:var(--text);letter-spacing:1px;
  line-height:1;
}
.title-block .sub{font-size:12px;color:var(--text-dim);margin-top:5px}
 
.progress-wrap{text-align:right}
.progress-num{
  font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:700;
  color:var(--cyan);text-shadow:var(--glow-cyan);line-height:1;
}
.progress-label{font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-top:2px}
 
/* pool */
.pool-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:20px;
  position:relative;overflow:hidden;
}
.pool-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.6;
}
.pool-section-label{
  font-size:9px;letter-spacing:3px;color:var(--text-dim);
  font-family:'Rajdhani',sans-serif;margin-bottom:12px;
}
.pool-tags{display:flex;flex-wrap:wrap;gap:8px}
.zone-tag{
  display:inline-flex;align-items:center;
  padding:5px 14px;border-radius:4px;
  font-size:12px;font-weight:500;
  border:1px solid rgba(0,245,255,.3);
  background:rgba(0,245,255,.06);
  color:var(--cyan);
  transition:opacity .3s,transform .3s,background .2s,box-shadow .2s;
  white-space:nowrap;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.zone-tag.used{opacity:0;transform:scale(0.5) translateY(-10px);pointer-events:none}
.zone-tag.hl{
  background:rgba(0,245,255,.18);
  border-color:var(--cyan);
  box-shadow:var(--glow-cyan);
  transform:scale(1.08);
}
.zone-tag.winner{
  background:rgba(57,255,126,.18);
  border-color:var(--green);
  color:var(--green);
  box-shadow:var(--glow-green);
  transform:scale(1.15);
  animation:winnerPulse .4s ease infinite alternate;
}
@keyframes winnerPulse{to{box-shadow:0 0 16px #39ff7e,0 0 40px #39ff7e66}}
.pool-empty{font-size:12px;color:var(--green);letter-spacing:2px;font-family:'Rajdhani',sans-serif}
 
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px}
 
.dbox{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:20px 10px 16px;
  text-align:center;
  cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;
  user-select:none;
  position:relative;overflow:hidden;
}
.dbox::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--border);
  transition:background .2s,box-shadow .2s;
}
.dbox:hover:not(.drawn):not(.locked){
  border-color:rgba(0,245,255,.4);
  background:rgba(0,245,255,.04);
  transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,245,255,.1);
}
.dbox:hover:not(.drawn):not(.locked)::before{
  background:var(--cyan);box-shadow:var(--glow-cyan);
}
.dbox.locked{cursor:default;border-color:rgba(255,45,120,.3)}
.dbox.locked::before{background:var(--magenta);box-shadow:var(--glow-magenta);animation:scanBar 1s linear infinite}
@keyframes scanBar{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.dbox.drawn{
  background:rgba(57,255,126,.05);
  border-color:rgba(57,255,126,.35);
  cursor:default;
}
.dbox.drawn::before{background:var(--green);box-shadow:var(--glow-green)}
 
.dstatus{
  font-size:9px;color:var(--text-dim);
  letter-spacing:2px;margin-bottom:6px;
  font-family:'Rajdhani',sans-serif;
  text-transform:uppercase;
}
.dbox.drawn .dstatus{color:var(--green)}
.dbox.locked .dstatus{color:var(--magenta);animation:blink .7s step-end infinite}
@keyframes blink{50%{opacity:0}}
.dname{
  font-family:'Rajdhani',sans-serif;
  font-size:22px;font-weight:700;
  color:var(--text);
  line-height:1;margin-bottom:8px;
}
.dbox.locked .dname{color:var(--magenta);text-shadow:var(--glow-magenta)}
.dresult{
  font-size:11px;color:var(--text-dim);min-height:18px;
  transition:transform .3s,opacity .3s;
  word-break:break-all;line-height:1.3;
}
.dbox.drawn .dresult{color:var(--green);font-weight:500}
.burst-canvas{position:absolute;inset:0;pointer-events:none}
 
/* actions */
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  font-size:12px;color:var(--text-dim);
  background:transparent;
  border:1px solid var(--border);
  border-radius:4px;padding:8px 18px;
  cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
  letter-spacing:.5px;
  transition:all .15s;
  clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);
}
.btn:hover:not(:disabled){
  border-color:rgba(0,245,255,.4);color:var(--cyan);
  background:rgba(0,245,255,.06);
}
.btn:disabled{opacity:.3;cursor:default}
.btn-export{
  background:rgba(57,255,126,.1);
  color:var(--green);
  border-color:rgba(57,255,126,.4);
  font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
  text-decoration:none;
}
.btn-export:hover:not([disabled]){
  background:rgba(57,255,126,.18)!important;
  border-color:var(--green)!important;
  box-shadow:var(--glow-green);
  color:var(--green)!important;
}
.btn-right{margin-left:auto}
.btn-settings{
  border-color:rgba(191,95,255,.4);color:var(--purple);
  background:rgba(191,95,255,.06);
}
.btn-settings:hover{
  border-color:var(--purple)!important;color:var(--purple)!important;
  background:rgba(191,95,255,.12)!important;
  box-shadow:0 0 8px #bf5fff88!important;
}
 
/* toast */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--panel);
  border:1px solid var(--green);
  color:var(--green);
  padding:10px 24px;border-radius:4px;
  font-size:13px;font-weight:500;
  opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;z-index:9999;
  white-space:nowrap;
  box-shadow:var(--glow-green);
  font-family:'Rajdhani',sans-serif;letter-spacing:1px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
 
/* ── FULLSCREEN REVEAL OVERLAY ── */
#revealOverlay{
  display:none;position:fixed;inset:0;z-index:9800;
  background:rgba(5,8,16,.96);
  align-items:center;justify-content:center;
  flex-direction:column;
  overflow:hidden;
}
#revealOverlay.active{display:flex}
#revealOverlay canvas#bgCanvas{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
}
.reveal-inner{
  position:relative;z-index:2;
  text-align:center;
  animation:revealIn .5s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes revealIn{from{opacity:0;transform:scale(.6) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)}}
.reveal-dorm-label{
  font-size:11px;letter-spacing:4px;color:var(--text-dim);
  font-family:'Rajdhani',sans-serif;margin-bottom:8px;
}
.reveal-dorm{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(60px,15vw,120px);
  font-weight:700;
  line-height:1;
  color:var(--text);
  text-shadow:0 0 40px rgba(0,245,255,.6),0 0 80px rgba(0,245,255,.3);
  margin-bottom:16px;
}
.reveal-gets{font-size:13px;letter-spacing:3px;color:var(--text-dim);font-family:'Rajdhani',sans-serif;margin-bottom:20px}
.reveal-zone{
  font-family:'Rajdhani',sans-serif;
  font-size:clamp(28px,7vw,56px);
  font-weight:700;
  color:var(--green);
  text-shadow:0 0 20px #39ff7e,0 0 60px #39ff7e66;
  letter-spacing:2px;
  margin-bottom:36px;
}
.reveal-close{
  font-size:12px;letter-spacing:3px;color:var(--text-dim);
  font-family:'Rajdhani',sans-serif;
  cursor:pointer;
  border:1px solid var(--border);
  padding:10px 32px;
  border-radius:4px;
  background:transparent;
  color:var(--text-dim);
  transition:all .2s;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.reveal-close:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow-cyan)}
.reveal-scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,245,255,.03) 3px,rgba(0,245,255,.03) 4px);
}
.reveal-corner{position:absolute;width:40px;height:40px;pointer-events:none}
.reveal-corner.tl{top:20px;left:20px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);box-shadow:inset 0 0 10px rgba(0,245,255,.1)}
.reveal-corner.tr{top:20px;right:20px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan)}
.reveal-corner.bl{bottom:20px;left:20px;border-bottom:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.reveal-corner.br{bottom:20px;right:20px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
 
/* glitch animation for dorm number */
.glitch{animation:glitch .6s steps(1) 3}
@keyframes glitch{
  0%{text-shadow:0 0 40px rgba(0,245,255,.6),0 0 80px rgba(0,245,255,.3)}
  20%{text-shadow:-3px 0 var(--magenta),3px 0 var(--cyan)}
  40%{text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
  60%{text-shadow:-3px 0 var(--cyan),3px 0 var(--magenta)}
  80%{text-shadow:3px 0 var(--cyan),-3px 0 var(--magenta)}
  100%{text-shadow:0 0 40px rgba(0,245,255,.6),0 0 80px rgba(0,245,255,.3)}
}
 
/* modals */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(5,8,16,.85);
  backdrop-filter:blur(6px);
  align-items:center;justify-content:center;z-index:10000;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:28px 24px;
  width:90%;max-width:360px;
  position:relative;overflow:hidden;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));
  box-shadow:0 0 12px rgba(0,245,255,.5);
}
.modal h3{
  font-family:'Rajdhani',sans-serif;
  font-size:18px;font-weight:700;
  color:var(--text);letter-spacing:2px;
  margin-bottom:16px;
}
.modal label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:5px;letter-spacing:1px}
.modal textarea,.modal input[type=password]{
  width:100%;padding:10px 12px;
  font-size:13px;border-radius:4px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:var(--text);
  outline:none;
  font-family:'Noto Sans TC',sans-serif;
  transition:border-color .2s,box-shadow .2s;
}
.modal textarea{height:96px;resize:vertical;margin-bottom:16px}
.modal input[type=password]{margin-bottom:8px}
.modal textarea:focus,.modal input[type=password]:focus{
  border-color:rgba(0,245,255,.5);
  box-shadow:0 0 0 2px rgba(0,245,255,.1);
}
.btn-save{
  width:100%;padding:11px;
  background:rgba(0,245,255,.1);
  color:var(--cyan);
  border:1px solid rgba(0,245,255,.4);
  border-radius:4px;cursor:pointer;
  font-size:14px;font-weight:500;
  font-family:'Rajdhani',sans-serif;letter-spacing:2px;
  transition:all .2s;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.btn-save:hover{background:rgba(0,245,255,.18);box-shadow:var(--glow-cyan)}
.pwd-err{font-size:12px;color:var(--magenta);min-height:18px;margin-bottom:8px}
 
/* corner decorations on app */
.corner-deco{position:fixed;pointer-events:none;z-index:5}
.corner-deco.tl{top:12px;left:12px;width:24px;height:24px;border-top:1px solid rgba(0,245,255,.3);border-left:1px solid rgba(0,245,255,.3)}
.corner-deco.br{bottom:12px;right:12px;width:24px;height:24px;border-bottom:1px solid rgba(0,245,255,.3);border-right:1px solid rgba(0,245,255,.3)}
</style>
</head>
<body>
<div class="corner-deco tl"></div>
<div class="corner-deco br"></div>
 
<div class="app-wrap">
  <div class="header">
    <div class="title-block">
      <div class="label">DORMITORY SYSTEM // v2.0</div>
      <h1>掃區分配抽籤</h1>
      <div class="sub">點擊寢室，命運由此決定</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-num" id="progress">0<span style="font-size:18px;color:var(--text-dim)"> / </span><span id="totalNum">0</span></div>
      <div class="progress-label">ASSIGNED</div>
    </div>
  </div>
 
  <div class="pool-panel">
    <div class="pool-section-label">ZONE POOL // 剩餘掃區</div>
    <div class="pool-tags" id="zonesPool"></div>
  </div>
 
  <div class="grid" id="grid"></div>
 
  <div class="actions">
    <button class="btn" onclick="confirmReset()">重置</button>
    <a id="exportBtn" class="btn btn-export" style="opacity:.3;pointer-events:none">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 10v2h10v-2M7 2v7M4 6l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      匯出 EXCEL
    </a>
    <button class="btn btn-settings btn-right" onclick="openModal()">設定名單</button>
  </div>
</div>
 
<!-- fullscreen reveal -->
<div id="revealOverlay">
  <canvas id="bgCanvas"></canvas>
  <div class="reveal-scanlines"></div>
  <div class="reveal-corner tl"></div>
  <div class="reveal-corner tr"></div>
  <div class="reveal-corner bl"></div>
  <div class="reveal-corner br"></div>
  <div class="reveal-inner">
    <div class="reveal-dorm-label">ROOM</div>
    <div class="reveal-dorm" id="revDorm">301</div>
    <div class="reveal-gets">ASSIGNED ZONE</div>
    <div class="reveal-zone" id="revZone">垃圾</div>
    <button class="reveal-close" onclick="closeReveal()">CONFIRM // 確認</button>
  </div>
</div>
 
<div id="toast" class="toast"></div>
 
<!-- reset pwd modal -->
<div class="modal-bg" id="resetPwdBg" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <h3>CONFIRM RESET</h3>
    <p style="font-size:12px;color:var(--text-dim);margin-bottom:14px;letter-spacing:.5px">輸入密碼以重置所有抽籤進度</p>
    <input id="resetPwdInput" type="password" placeholder="PASSWORD" onkeydown="if(event.key==='Enter')checkResetPwd()">
    <div id="resetPwdErr" class="pwd-err"></div>
    <button class="btn-save" onclick="checkResetPwd()">確認重置</button>
  </div>
</div>
 
<!-- settings pwd modal -->
<div class="modal-bg" id="pwdBg" onclick="pwdBgClick(event)">
  <div class="modal">
    <h3>ACCESS CONTROL</h3>
    <input id="pwdInput" type="password" placeholder="PASSWORD" onkeydown="if(event.key==='Enter')checkPwd()">
    <div id="pwdErr" class="pwd-err"></div>
    <button class="btn-save" onclick="checkPwd()">確認</button>
  </div>
</div>
 
<!-- settings modal -->
<div class="modal-bg" id="modalBg" onclick="bgClick(event)">
  <div class="modal">
    <h3>EDIT ROSTER</h3>
    <label>寢室清單（每行一個）</label>
    <textarea id="dormsInput"></textarea>
    <label>公共掃區（每行一個）</label>
    <textarea id="zonesInput"></textarea>
    <button class="btn-save" onclick="saveAndRefresh()">儲存並開新回合</button>
  </div>
</div>
 
<script>
/* ─── audio engine ─────────────────────────────── */
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq,type,dur,vol,delay=0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime+delay);
  g.gain.setValueAtTime(0,AC.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+delay+.01);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+delay+dur);
  o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur+.05);
}
function playTick(){beep(800+Math.random()*400,'square',.04,.06)}
function playWin(){
  beep(440,'sine',.12,.12);beep(554,'sine',.12,.1,.13);
  beep(659,'sine',.12,.1,.26);beep(880,'sine',.3,.15,.4);
}
function playClick(){beep(600,'square',.06,.08)}
function resumeAC(){if(AC.state==='suspended')AC.resume();}
 
/* ─── vibration ────────────────────────────────── */
function vib(pattern){if(navigator.vibrate)navigator.vibrate(pattern);}
 
/* ─── state ────────────────────────────────────── */
let remainingPool=[],drawn=0,total=0,busy=false,results=[];
let pendingReveal=null;
 
function ld(k,d){try{return localStorage.getItem(k)||d}catch{return d}}
function sv(k,v){try{localStorage.setItem(k,v)}catch{}}
 
/* ─── init ─────────────────────────────────────── */
function initApp(){
  drawn=0;busy=false;results=[];pendingReveal=null;
  const btn=document.getElementById('exportBtn');
  btn.style.opacity='.3';btn.style.pointerEvents='none';
  btn.removeAttribute('href');btn.removeAttribute('download');
 
  const dorms=ld('d_dorms',"301\n302\n303\n304\n307\n308\n309\n310\n311\n312\n401\n402\n403\n404\n408").trim().split('\n').filter(x=>x.trim());
  const zones=ld('d_zones',"垃圾\n垃圾\n2樓 洗衣場+晒衣場\n3樓 洗衣場+晒衣場\n4樓 洗衣場+晒衣場\n2樓 廁所\n3樓 廁所\n4樓 廁所\n2樓 浴室\n3樓 浴室\n4樓 浴室\n2樓 琉理台+走廊+飲水機\n3樓 琉理台+走廊+飲水機\n4樓 琉理台+走廊+飲水機\n2.4樓冰箱").trim().split('\n').filter(x=>x.trim());
  total=dorms.length;
  let pool=[...zones];
  while(pool.length<dorms.length)pool.push('自主清潔');
  pool=pool.slice(0,dorms.length);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  remainingPool=[...pool];
 
  const pe=document.getElementById('zonesPool');pe.innerHTML='';
  pool.forEach(z=>{
    const t=document.createElement('span');
    t.className='zone-tag';t.textContent=z;t.dataset.zone=z;
    pe.appendChild(t);
  });
 
  const g=document.getElementById('grid');g.innerHTML='';
  dorms.forEach(d=>{
    const b=document.createElement('div');
    b.className='dbox';b.id='box-'+d;
    b.onclick=()=>{resumeAC();reveal(d)};
    b.innerHTML=`<canvas class="burst-canvas" id="bc-${d}"></canvas>
      <div class="dstatus" id="st-${d}">READY</div>
      <div class="dname">${d}</div>
      <div class="dresult" id="res-${d}">—</div>`;
    g.appendChild(b);
  });
  updateProgress();
}
 
/* ─── reveal logic ─────────────────────────────── */
function reveal(dorm){
  if(busy)return;
  const box=document.getElementById('box-'+dorm);
  if(!box||box.classList.contains('drawn')||box.classList.contains('locked'))return;
  busy=true;box.classList.add('locked');
  document.getElementById('st-'+dorm).textContent='DRAWING';
  document.getElementById('res-'+dorm).textContent='';
  vib([30]);playClick();
 
  const pickIdx=Math.floor(Math.random()*remainingPool.length);
  const zone=remainingPool[pickIdx];
  remainingPool.splice(pickIdx,1);
 
  const avail=Array.from(document.querySelectorAll('#zonesPool .zone-tag:not(.used)'));
  if(!avail.length){finish(dorm,zone);return;}
  const winnerTag=avail.find(t=>t.dataset.zone===zone&&!t.classList.contains('used'))||avail[0];
  const wi=avail.indexOf(winnerTag);
 
  const FAST=10+Math.floor(Math.random()*6);
  let steps=[];
  for(let i=0;i<FAST;i++){
    let idx;
    do{idx=Math.floor(Math.random()*avail.length);}
    while(avail.length>1&&steps.length>0&&avail[idx]===steps[steps.length-1]);
    steps.push(avail[idx]);
  }
  const lastIdx=avail.indexOf(steps[steps.length-1]);
  const dist=((wi-lastIdx+avail.length)%avail.length)||avail.length;
  const extraLap=Math.floor(Math.random()*2)*avail.length;
  const totalSlow=dist+extraLap;
  for(let i=1;i<=totalSlow;i++)steps.push(avail[(lastIdx+i)%avail.length]);
 
  const slowStart=FAST;
  const delays=steps.map((_,i)=>{
    if(i<slowStart)return 45;
    const r=(i-slowStart)/(steps.length-slowStart);
    return Math.round(45+r*r*280);
  });
 
  let cur=-1;
  function step(i){
    if(cur>=0&&steps[cur])steps[cur].classList.remove('hl','winner');
    if(i>=steps.length){
      winnerTag.classList.add('winner');
      vib([15,30,15,30,60]);
      setTimeout(()=>{
        winnerTag.classList.remove('winner');
        winnerTag.classList.add('used');
        showFullscreenReveal(dorm,zone,()=>finish(dorm,zone));
      },500);
      return;
    }
    cur=i;steps[i].classList.add('hl');
    playTick();
    setTimeout(()=>step(i+1),delays[i]);
  }
  step(0);
}

/* ─── particle bg ──────────────────────────────── */
let animId=null;
function startParticles(){
  const c=document.getElementById('bgCanvas');
  c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const colors=['#00f5ff','#ff2d78','#39ff7e','#bf5fff','#ffe600'];
  const pts=Array.from({length:120},()=>({
    x:Math.random()*c.width,y:Math.random()*c.height,
    vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,
    r:Math.random()*2.5+.5,
    color:colors[Math.floor(Math.random()*colors.length)],
    life:Math.random(),decay:.004+Math.random()*.008,
  }));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
      if(p.life<=0){
        p.x=Math.random()*c.width;p.y=Math.random()*c.height;
        p.life=1;p.color=colors[Math.floor(Math.random()*colors.length)];
      }
      ctx.save();ctx.globalAlpha=p.life*.7;
      ctx.shadowBlur=8;ctx.shadowColor=p.color;
      ctx.fillStyle=p.color;ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    animId=requestAnimationFrame(draw);
  }
  if(animId)cancelAnimationFrame(animId);
  draw();
}
function stopParticles(){if(animId){cancelAnimationFrame(animId);animId=null;}}
 
/* ─── finish ───────────────────────────────────── */
function finish(dorm,zone){
  const box=document.getElementById('box-'+dorm);

    res.style.opacity='1';res.style.transform='translateY(0)';
  },20);

  if(drawn===total){
    const p=document.getElementById('zonesPool');

/* ─── burst ────────────────────────────────────── */
function burst(dorm){
  const c=document.getElementById('bc-'+dorm);if(!c)return;
  const box=document.getElementById('box-'+dorm);
  c.width=box.offsetWidth;c.height=box.offsetHeight;
  const ctx=c.getContext('2d');
  const cols=['#00f5ff','#39ff7e','#ff2d78','#bf5fff','#ffe600'];
  const ps=Array.from({length:28},()=>({
    x:c.width/2,y:c.height/2,
    vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-3,
    r:Math.random()*2.5+1,
    color:cols[Math.floor(Math.random()*cols.length)],
    life:1
  }));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);let alive=false;
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=.028;
      if(p.life<=0)return;alive=true;
      ctx.save();ctx.globalAlpha=p.life;
      ctx.shadowBlur=6;ctx.shadowColor=p.color;
      ctx.fillStyle=p.color;ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    ctx.globalAlpha=1;if(alive)requestAnimationFrame(draw);
  }
  draw();
}

/* ─── export ───────────────────────────────────── */
function activateExport(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dateStr=`${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;
  const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const filename=`掃區分配_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.xlsx`;
  const zoneCounts={};
  results.forEach(r=>zoneCounts[r.zone]=(zoneCounts[r.zone]||0)+1);
  function parseFloor(z){const m=z.match(/^(\d+(\.\d+)?樓)/);return m?m[1]:'';}
  function parseZoneName(z){return z.replace(/^\d+(\.\d+)?樓\s*/,'');}
  const zoneOrder=['垃圾','洗衣場+晒衣場','廁所','浴室','琉理台+走廊+飲水機','2.4樓冰箱'];
  const floorOrder={'2樓':1,'3樓':2,'4樓':3,'':9};
  const sorted=[...results].sort((a,b)=>{
    const za=parseZoneName(a.zone),zb=parseZoneName(b.zone);
    const zo=(zoneOrder.indexOf(za)||99)-(zoneOrder.indexOf(zb)||99);
    if(zo!==0)return zo;
    return(floorOrder[parseFloor(a.zone)]||9)-(floorOrder[parseFloor(b.zone)]||9);
  });
  const noFloor=['垃圾','2.4樓冰箱'];
  const s1=[['樓層','男宿掃地區域表',''],...sorted.map(r=>{
    const zn=parseZoneName(r.zone),fl=parseFloor(r.zone);
    return[noFloor.includes(zn)?'':fl,zn,String(r.dorm)];
  })];
  const s2=[['掃區','分配間數'],...Object.entries(zoneCounts),['',''],
    ['總寢室數',String(results.length)],['抽籤日期',dateStr],['抽籤時間',timeStr]];
  const bytes=buildXlsx([{name:'分配結果',rows:s1},{name:'統計摘要',rows:s2}]);
  const b64=bytesToBase64(bytes);
  const btn=document.getElementById('exportBtn');
  btn.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+b64;
  btn.download=filename;btn.style.opacity='1';btn.style.pointerEvents='auto';
}

/* ─── xlsx / zip (unchanged logic) ─────────────── */
function bytesToBase64(b){const C=0x8000;let s='';for(let i=0;i<b.length;i+=C)s+=String.fromCharCode(...b.subarray(i,i+C));return btoa(s);}
function buildXlsx(sheets){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  const sst=[];const sstMap={};
  function si(s){const k=String(s);if(sstMap[k]===undefined){sstMap[k]=sst.length;sst.push(k);}return sstMap[k];}
  sheets.forEach(sh=>sh.rows.forEach(row=>row.forEach(c=>{if(c!=null)si(c);})));
  function col(n){let s='';n++;while(n>0){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26);}return s;}
  const shXmls=sheets.map(sh=>{
    const mc=Math.max(...sh.rows.map(r=>r.length));
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>';
    for(let c=0;c<mc;c++)x+=`<col min="${c+1}" max="${c+1}" width="18" customWidth="1"/>`;
    x+='</cols><sheetData>';
    sh.rows.forEach((row,ri)=>{x+=`<row r="${ri+1}">`;row.forEach((cell,ci)=>{const a=col(ci)+(ri+1);if(cell==null){x+=`<c r="${a}"/>`;return;}x+=`<c r="${a}" t="s"><v>${si(cell)}</v></c>`;});x+='</row>';});
    x+='</sheetData></worksheet>';return x;
  });
  let sstXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sst.length}" uniqueCount="${sst.length}">`;
  sst.forEach(s=>{sstXml+=`<si><t xml:space="preserve">${esc(s)}</t></si>`;});sstXml+='</sst>';
  let wbXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach((sh,i)=>{wbXml+=`<sheet name="${esc(sh.name)}" sheetId="${i+1}" r:id="rId${i+2}"/>`;});wbXml+='</sheets></workbook>';
  let wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>';
  sheets.forEach((_,i)=>{wbRels+=`<Relationship Id="rId${i+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`;});wbRels+='</Relationships>';
  let ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>';
  sheets.forEach((_,i)=>{ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;});ct+='</Types>';
  const topRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const files={'[Content_Types].xml':ct,'_rels/.rels':topRels,'xl/workbook.xml':wbXml,'xl/_rels/workbook.xml.rels':wbRels,'xl/sharedStrings.xml':sstXml};
  sheets.forEach((sh,i)=>{files[`xl/worksheets/sheet${i+1}.xml`]=shXmls[i];});
  return buildZip(files);
}
function buildZip(files){
  const enc=new TextEncoder();
  function u16(n){return[n&0xff,(n>>8)&0xff];}
  function u32(n){return[n&0xff,(n>>8)&0xff,(n>>16)&0xff,(n>>24)&0xff];}
  function crc32(d){let c=0xFFFFFFFF;const t=[];for(let i=0;i<256;i++){let n=i;for(let j=0;j<8;j++)n=n&1?0xEDB88320^(n>>>1):n>>>1;t[i]=n;}for(let i=0;i<d.length;i++)c=t[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
  const parts=[];const cds=[];let offset=0;
  Object.entries(files).forEach(([name,content])=>{
    const nb=enc.encode(name),db=enc.encode(content),crc=crc32(db),sz=db.length;
    const lh=new Uint8Array([0x50,0x4B,0x03,0x04,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)]);
    parts.push(lh);parts.push(nb);parts.push(db);
    cds.push({nb,crc,sz,offset});offset+=lh.length+nb.length+sz;
  });
  const cdStart=offset;
  cds.forEach(({nb,crc,sz,offset:lo})=>{
    const cd=new Uint8Array([0x50,0x4B,0x01,0x02,20,0,20,0,0,0,0,0,0,0,0,0,...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(lo)]);
    parts.push(cd);parts.push(nb);offset+=cd.length+nb.length;
  });
  const cdSz=offset-cdStart;
  parts.push(new Uint8Array([0x50,0x4B,0x05,0x06,0,0,0,0,...u16(cds.length),...u16(cds.length),...u32(cdSz),...u32(cdStart),0,0]));
  const total=parts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(total);let pos=0;
  parts.forEach(p=>{out.set(p,pos);pos+=p.length;});
  return out;
}
